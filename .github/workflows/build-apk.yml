name: Build AudioScribeAI APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Estrai progetto
        run: unzip -o AudioScribeAI-source.zip

      - name: Configura Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installa Android SDK 36
        shell: bash
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compila APK
        working-directory: AudioScribeAI
        run: gradle --no-daemon assembleDebug

      - name: Salva APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioScribeAI-debug
          path: AudioScribeAI/app/build/outputs/apk/debug/app-debug.apk
